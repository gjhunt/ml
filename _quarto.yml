# _quarto.yml
project:
  type: book
  output-dir: docs
  resources:
    - images
    - data
    - static

book:
  title: "Statistical Learning"
  author:
    - name: "Gregory J. Hunt"
  date: today
  date-format: "MMMM D, YYYY"

  # Repo integration
  repo-url: "https://github.com/gjhunt/ml"
  repo-actions: [issue]

  search: true
  page-navigation: true
  back-to-top-navigation: true

  sidebar:
    style: docked
    collapse-level: 2

  chapters:
    - index.ipynb
    - part: "Foundations and Linear Models"
      chapters:
        - lectures/000_intro_and_erm.ipynb
        - lectures/001_derivatives.ipynb
        - lectures/002_linear_regression.ipynb
        - lectures/003_logistic_regression.ipynb
        - lectures/004_multiclass_logistic_regression.ipynb

    - part: "Evaluation and Model Selection"
      chapters:
        - lectures/005_evaluation.ipynb
        - lectures/006_model_selection.ipynb
        - lectures/007_knn.ipynb
        - lectures/008_bias_variance.ipynb

    - part: "Regularization and Penalized Models"
      chapters:
        - lectures/009_ridge.ipynb
        - lectures/010_lasso.ipynb
        - lectures/011_elastic_net_logistic_erm.ipynb

    - part: "Neural Networks"
      chapters:
        - lectures/012_nn.ipynb
        - lectures/013_backprop.ipynb
        - lectures/014_nn_arch.ipynb

    - part: "Unsupervised Learning"
      chapters:
        - lectures/015_unsupervised.ipynb
        - lectures/016_pca.ipynb
        - lectures/017_kmeans.ipynb

    - part: "Tree-Based Methods"
      chapters:
        - lectures/018_trees.ipynb
        - lectures/019_random_forests.ipynb
        - lectures/020_boosting.ipynb

    - part: "Practice Questions"
      chapters:
        - questions/000_intro_and_erm_questions.ipynb
        - questions/001_derivatives_questions.ipynb
        - questions/002_linear_regression_questions.ipynb
        - questions/003_logistic_regression_questions.ipynb
        - questions/004_multiclass_logistic_regression_questions.ipynb
        - questions/005_evaluation_questions.ipynb
        - questions/006_model_selection_questions.ipynb
        - questions/007_knn_questions.ipynb
        - questions/008_bias_variance_questions.ipynb
        - questions/009_ridge_questions.ipynb
        - questions/010_lasso_questions.ipynb
        - questions/011_elastic_net_logistic_erm_questions.ipynb
        - questions/012_nn_questions.ipynb
        - questions/013_backprop_questions.ipynb
        - questions/014_nn_arch_questions.ipynb
        - questions/016_pca_questions.ipynb
        - questions/017_kmeans_questions.ipynb
        - questions/018_trees_questions.ipynb
        - questions/019_random_forests_questions.ipynb
        - questions/020_boosting_questions.ipynb


    #- part: "Extras"
    #  chapters:
    #    - lectures/EXTRA_040_ERM_NLL.ipynb
    #    - questions/EXTRA_040_ERM_NLL_questions.ipynb
    #    - lectures/EXTRA_090_curse_dim.ipynb
    #    - lectures/EXTRA_101_constr_optim.ipynb
    #    - lectures/EXTRA_170_svd.ipynb

crossref:
  fig-title: "Figure"
  tbl-title: "Table"
  eq-title: "Equation"
  fig-prefix: "Fig."
  tbl-prefix: "Tbl."
  eq-prefix: "Eq."
  lst-title: "Snippet"
  lst-prefix: "Snippet"

format:
  html:
    theme:
      light: [materia, assets/light.scss]
      dark: [darkly, assets/dark.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    code-summary: "Show code"
    code-fold: show   
    code-tools: true
    code-copy: true
    highlight-style: pygments
    code-block-border-left: "#e6e6e6"
    code-block-padding-left: 6
    code-block-padding-right: 6
    code-block-padding-top: 4
    code-block-padding-bottom: 4
    fig-cap-location: bottom
    callout-appearance: simple
    grid:
      sidebar-width: 300px
      body-width: 900px
      margin-width: 300px
    css: assets/code_style.css

  pdf:
    toc: true
    toc-depth: 1
    number-sections: true
    colorlinks: true
    listings: false
    keep-tex: true
    highlight-style: pygments
    code-block-bg: "#fbfbfb"
    code-block-border-left: "#e6e6e6"
    code-block-border-left-width: 10pt
    code-block-padding-left: 6
    code-block-padding-right: 6
    code-block-padding-top: 4
    code-block-padding-bottom: 4
    engine: xelatex
    monofont: "DejaVu Sans Mono"
    include-in-header:
      - assets/code_style.tex
    include-before-body:
      - assets/code_style_body.tex

  epub:
    toc: true
    number-sections: true

execute:
  echo: true
  output: true
  execute-notebooks: false

# Knitr defaults, only used when rendering R/knitr code
knitr:
  opts_chunk:
    fig.align: center
    out.width: "80%"

# Global defaults for code blocks
code-block-background: true

lang: en
